name: cafe_culture
description: A user-friendly mobile app for cafe customers to explore menu, place orders, and track deliveries.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  flutter_cache_manager: ^3.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

platforms:
  android:
  ios:
  web: